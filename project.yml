name: MP9
options:
  bundleIdPrefix: dev.gaotao
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: '17.0'
packages:
  MP9Kit:
    path: Packages/MP9Kit
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1'
    CURRENT_PROJECT_VERSION: '1'
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  MP9:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.gaotao.mp9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MP9Kit
        product: MP9Kit
schemes:
  MP9:
    build:
      targets:
        MP9: all
    test:
      targets: []
